<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2ECC8F" />
  <title>运动健康助手</title>
  <link rel="stylesheet" href="assets/css/style.css?v=4" />
</head>
<body>
  <div class="phone">
    <!-- 状态栏 -->
    <div class="statusbar">
      <span>9:41</span>
      <span class="dots">📶 🔋</span>
    </div>

    <!-- 页面内容（由 app.js 渲染） -->
    <div id="view"></div>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <div class="tab active" data-tab="home" data-act="nav:home"><span class="ti">🏠</span>首页</div>
      <div class="tab" data-tab="sport" data-act="nav:sport"><span class="ti">🎯</span>运动</div>
      <div class="tab" data-tab="insight" data-act="nav:insight"><span class="ti">📊</span>数据</div>
      <div class="tab" data-tab="community" data-act="nav:community"><span class="ti">💬</span>社区</div>
      <div class="tab" data-tab="profile" data-act="nav:profile"><span class="ti">👤</span>我的</div>
    </nav>

    <!-- 弹层 -->
    <div class="sheet-mask" id="sheet-mask"></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <script src="assets/js/data.js?v=4"></script>
  <script src="assets/js/charts.js?v=4"></script>
  <script src="assets/js/app.js?v=4"></script>
</body>
</html>
